<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Contact • InisCare Supervisors</title>
    <link rel="icon" type="image/png" href="InisCare-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }
        .contact-card {
            background: #ffffff;
            border-radius: var(--radius-lg, 12px);
            padding: 36px 32px;
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.06));
            border-top: 5px solid var(--primary, #005952);
        }
        .contact-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .contact-header img {
            height: 48px;
            margin-bottom: 12px;
        }
        .contact-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            color: var(--primary, #005952);
            margin: 0 0 6px 0;
        }
        .contact-header p {
            font-size: 14px;
            color: var(--text-muted, #64748b);
            margin: 0;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .form-group label .req {
            color: #dc2626;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            color: #1e293b;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary, #005952);
            box-shadow: 0 0 0 3px rgba(0, 89, 82, 0.12);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 580px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .contact-card {
                padding: 24px 20px;
            }
        }
        .btn-submit-contact {
            width: 100%;
            background: var(--primary, #005952);
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s;
            margin-top: 24px;
        }
        .btn-submit-contact:hover {
            background: #00433e;
        }
        .btn-submit-contact:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .status-box {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }
        .status-box.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            display: block;
        }
        .status-box.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }
    </style>
</head>
<body style="background: var(--bg-portal, #f1f5f9);">

    <div class="nav-back-bar" style="max-width: 680px; margin: 15px auto 10px auto; padding: 0 20px;">
        <a href="index.html" class="nav-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Back to Portal</span>
        </a>
    </div>

    <div class="contact-container" style="padding-top: 10px;">
        <div class="contact-card">
            <div class="contact-header">
                <img src="InisCare-logo.png" alt="InisCare">
                <h1>Support &amp; Contact</h1>
                <p>Have a question about the supervisors portal, form compliance, or technical support? Send us a message and our team will get back to you.</p>
            </div>

            <div id="statusBox" class="status-box"></div>

            <form id="contactForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="inputName">Full Name <span class="req">*</span></label>
                        <input type="text" id="inputName" class="form-control" placeholder="e.g. Mary O'Connor" required>
                    </div>
                    <div class="form-group">
                        <label for="inputPhone">Phone Number</label>
                        <input type="tel" id="inputPhone" class="form-control" placeholder="e.g. 087 123 4567">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="inputEmail">Email Address <span class="req">*</span></label>
                        <input type="email" id="inputEmail" class="form-control" placeholder="e.g. supervisor@iniscare.ie" required>
                    </div>
                    <div class="form-group">
                        <label for="inputSubject">Subject</label>
                        <select id="inputSubject" class="form-control">
                            <option value="General Support">General Support / Question</option>
                            <option value="Form Issue / Bug">Form Issue or Bug Report</option>
                            <option value="Access / Account Request">Access or Account Request</option>
                            <option value="Clinical Documentation Feedback">Clinical Documentation Feedback</option>
                            <option value="Other">Other Inquiry</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="inputMessage">Message <span class="req">*</span></label>
                    <textarea id="inputMessage" class="form-control" rows="5" placeholder="Please describe your question or issue in detail..." required></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit-contact">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span>Send Message</span>
                </button>
            </form>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 12px; color: #94a3b8;">
            &copy; 2026 InisCare. All rights reserved. &bull; Home Care &amp; Clinical Documentation Portal
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('inputName').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const subject = document.getElementById('inputSubject').value;
            const message = document.getElementById('inputMessage').value.trim();

            if (!name || !email || !message) {
                statusBox.className = 'status-box error';
                statusBox.textContent = 'Please fill in all required fields (Name, Email, and Message).';
                statusBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>Sending message...</span>';
            statusBox.style.display = 'none';

            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, email, subject, message })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    statusBox.className = 'status-box success';
                    statusBox.innerHTML = '<strong>Message sent successfully!</strong> Thank you for reaching out. We have received your inquiry and will get back to you shortly.';
                    form.reset();
                } else {
                    statusBox.className = 'status-box error';
                    statusBox.textContent = data.error || 'Failed to send message. Please try again or email directly.';
                }
            } catch (err) {
                console.error('Contact error:', err);
                statusBox.className = 'status-box error';
                statusBox.textContent = 'Network error. Please check your connection and try again.';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span>Send Message</span>
                `;
                statusBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        });
    </script>
</body>
</html>
