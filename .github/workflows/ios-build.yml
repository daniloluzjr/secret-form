name: iOS Build & TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to Apple TestFlight'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select Xcode 16
        run: sudo xcode-select -switch /Applications/Xcode_16.0.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Install NPM dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Ruby and CocoaPods Cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          pod install --repo-update

      - name: Prepare Signing Keychain (if secrets provided)
        id: signing_check
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            
            # Create temporary keychain
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Import Distribution Certificate (.p12)
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            echo -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode -o "$CERTIFICATE_PATH"
            security import "$CERTIFICATE_PATH" -P "${{ secrets.P12_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Apply Provisioning Profile (.mobileprovision)
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo -n "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

            echo "iOS Signing Keychain configured successfully."
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "No signing secrets detected. Building with local release configuration."
          fi

      - name: Build & Archive iOS
        working-directory: mobile/ios
        run: |
          mkdir -p build
          if [ "${{ steps.signing_check.outputs.has_signing }}" == "true" ]; then
            xcodebuild \
              -workspace InisCareSupervisors.xcworkspace \
              -scheme InisCareSupervisors \
              -configuration Release \
              -archivePath build/InisCareSupervisors.xcarchive \
              archive
            
            # Export IPA
            cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>K282M9V8T2</string>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive -archivePath build/InisCareSupervisors.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/
          else
            xcodebuild \
              -workspace InisCareSupervisors.xcworkspace \
              -scheme InisCareSupervisors \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              build
            
            # Package into unsigned IPA artifact
            mkdir -p build/Payload
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "InisCareSupervisors.app" | head -n 1)
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r InisCareSupervisors.ipa Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InisCare_Supervisors_iOS
          path: mobile/ios/build/*.ipa
          retention-days: 14

      - name: Upload to Apple TestFlight (if App Store Connect API Key set)
        if: env.APP_STORE_CONNECT_API_KEY_KEY_ID != '' && steps.signing_check.outputs.has_signing == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file mobile/ios/build/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
